<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jejat.com</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap">
<style>
  :root {
    --orange: #F7941D;
    --orange-deep: #E07C0A;
    --red: #CE2029;
    --ink: #231A12;
    --ink-soft: #6E5F4E;
    --ground: #FFFDF8;
    --cream: #FBF1DD;
    --display: "Baloo Bhaijaan 2", "Segoe UI", Tahoma, sans-serif;
    --body: "Nunito", "Segoe UI", Tahoma, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--body);
    overflow-x: hidden;
  }

  .scene {
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(16px, 3vh, 32px) 24px 0;
    position: relative;
  }

  /* ---------- wordmark ---------- */
  .wordmark {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(1.6rem, 3.5vw, 2.2rem);
    letter-spacing: -0.01em;
    line-height: 1;
    animation: rise 0.7s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .wordmark .dotcom { color: var(--orange); }

  /* ---------- hero: the chicken ---------- */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    width: 100%;
  }

  .chicken-stage {
    position: relative;
    width: min(58vh, 88vw, 560px);
    animation: drop-in 0.9s cubic-bezier(.2,.9,.3,1.15) both;
  }

  .chicken-stage::before {
    /* soft cream glow behind the bird */
    content: "";
    position: absolute;
    inset: 4%;
    background: radial-gradient(closest-side, var(--cream), transparent 72%);
    z-index: 0;
  }

  .chicken {
    position: relative;
    z-index: 1;
    width: 100%;
    display: block;
    animation: run-bob 0.55s ease-in-out infinite;
    transform-origin: 50% 85%;
  }

  .shadow {
    width: 46%;
    height: 20px;
    margin: -2% auto 0;
    background: radial-gradient(closest-side, rgba(35, 26, 18, 0.18), transparent);
    border-radius: 50%;
    animation: shadow-pulse 0.55s ease-in-out infinite;
  }

  /* whoosh speed lines behind the chicken */
  .whoosh {
    position: absolute;
    left: -14%;
    height: 5px;
    border-radius: 3px;
    background: var(--orange);
    opacity: 0;
    z-index: 0;
    animation: whoosh 1.1s linear infinite;
  }
  .whoosh:nth-child(1) { top: 16%; width: 17%; animation-delay: 0s; }
  .whoosh:nth-child(2) { top: 24%; width: 24%; animation-delay: 0.35s; background: var(--red); height: 4px; }
  .whoosh:nth-child(3) { top: 82%; width: 14%; animation-delay: 0.7s; }

  /* ---------- headline ---------- */
  .headline {
    display: flex;
    align-items: baseline;
    gap: clamp(14px, 3vw, 28px);
    flex-wrap: wrap;
    justify-content: center;
    margin-top: clamp(6px, 1.5vh, 18px);
    animation: rise 0.8s 0.25s cubic-bezier(.2,.9,.3,1.2) both;
  }

  .headline .en {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(2.4rem, 7vw, 4.4rem);
    line-height: 1.05;
    letter-spacing: -0.015em;
    text-wrap: balance;
    margin: 0;
  }

  .headline .ar {
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(2rem, 5.5vw, 3.4rem);
    line-height: 1.05;
    color: var(--orange);
    direction: rtl;
  }

  .tagline {
    margin: clamp(8px, 1.5vh, 14px) auto 0;
    max-width: none;
    font-size: clamp(1rem, 2.2vw, 1.2rem);
    font-weight: 600;
    color: var(--ink-soft);
    line-height: 1.55;
    animation: rise 0.8s 0.4s cubic-bezier(.2,.9,.3,1.2) both;
  }
  .tagline strong { color: var(--red); font-weight: 700; }
  .tagline .mail {
    color: var(--orange-deep);
    font-weight: 700;
    text-decoration: none;
  }
  .tagline .mail:hover, .tagline .mail:focus-visible { text-decoration: underline; }
  @media (min-width: 900px) {
    .tagline { white-space: nowrap; }
  }

  /* ---------- road + rider ---------- */
  .road {
    position: relative;
    width: 100%;
    height: clamp(185px, 24vh, 235px);
    margin-top: clamp(10px, 2vh, 24px);
    overflow: hidden;
  }

  .road::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: clamp(26px, 5vh, 40px);
    border-bottom: 4px dashed rgba(35, 26, 18, 0.22);
  }

  .rider {
    position: absolute;
    bottom: clamp(10px, 2.5vh, 22px);
    left: 0;
    width: clamp(170px, 22vw, 260px);
    transform: translateX(-120%);
    animation: ride 9s linear 1.2s infinite;
    z-index: 2;
  }
  .rider img {
    width: 100%;
    display: block;
    animation: rider-bob 0.4s ease-in-out infinite;
  }

  /* ---------- keyframes ---------- */
  @keyframes run-bob {
    0%, 100% { transform: translateY(0) rotate(-1.2deg); }
    50%      { transform: translateY(-4.5%) rotate(1.2deg); }
  }
  @keyframes shadow-pulse {
    0%, 100% { transform: scaleX(1); opacity: 1; }
    50%      { transform: scaleX(0.78); opacity: 0.6; }
  }
  @keyframes whoosh {
    0%   { transform: translateX(160%); opacity: 0; }
    15%  { opacity: 0.85; }
    70%  { opacity: 0; }
    100% { transform: translateX(-190%); opacity: 0; }
  }
  @keyframes ride {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(calc(100vw + 40%)); }
  }
  @keyframes rider-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes drop-in {
    from { opacity: 0; transform: translateY(-30px) scale(0.92); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .chicken, .shadow, .rider, .rider img, .whoosh,
    .wordmark, .chicken-stage, .headline, .tagline {
      animation: none;
    }
    .rider { transform: translateX(8vw); }
    .whoosh { opacity: 0.5; transform: translateX(0); }
  }
</style>

<main class="scene">
  <div class="wordmark">Jejat<span class="dotcom">.com</span></div>

  <div class="hero">
    <div class="chicken-stage">
      <div class="whoosh"></div>
      <div class="whoosh"></div>
      <div class="whoosh"></div>
      <img class="chicken" src="assets/chicken-logo.png" alt="Jejat.com running chicken logo">
      <div class="shadow"></div>
    </div>

    <div class="headline">
      <h1 class="en">Coming soon</h1>
      <span class="ar" lang="ar">قريباً</span>
    </div>

    <p class="tagline">
      <strong>Syria's new souq.com</strong> - Next-day delivery e-commerce,
      launching in Aleppo soon. Founder : <a class="mail" href="mailto:karam@jejat.com">karam@jejat.com</a>
    </p>
  </div>

  <div class="road" aria-hidden="true">
    <div class="rider">
      <img src="assets/delivery-guy.png" alt="">
    </div>
  </div>
</main>
